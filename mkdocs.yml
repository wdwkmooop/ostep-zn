site_name: 操作系统导论：三个简单部件
site_description: "OSTEP (Operating Systems: Three Easy Pieces) 中文翻译 · 虚拟化、并发与持久化"
site_author: OSTEP 中文翻译计划
docs_dir: docs
site_dir: build
exclude_docs: |
  style-guide.md
# 输出明确的 .html 链接，使 build/index.html 通过 file:// 打开时也能前后翻页。
use_directory_urls: false

theme:
  name: material
  language: zh
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

plugins:
  - search:
      lang:
        - zh
        - en
  - glightbox

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - assets/js/mathjax.js
  - assets/js/theme-toggle.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - assets/css/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/remzi-arpacidusseau/ostep
      name: OSTEP 原书仓库

copyright: 原作 © 2008–18 Arpaci-Dusseau。本译本仅供学习交流，版权归原作者所有。

